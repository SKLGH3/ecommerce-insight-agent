logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:META_DB_HOST,localhost}
  port: ${oc.env:META_DB_PORT,3306}
  user: ${oc.env:META_DB_USER,insight_app}
  password: ${oc.env:META_DB_PASSWORD,change_me_app}
  database: ${oc.env:META_DB_NAME,meta}

db_dw:
  host: ${oc.env:DW_DB_HOST,localhost}
  port: ${oc.env:DW_DB_PORT,3306}
  user: ${oc.env:DW_DB_USER,insight_readonly}
  password: ${oc.env:DW_DB_PASSWORD,change_me_readonly}
  database: ${oc.env:DW_DB_NAME,dw}

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: ${oc.env:QDRANT_EMBEDDING_SIZE,1024}

embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: ${oc.env:EMBEDDING_MODEL,BAAI/bge-large-zh-v1.5}

es:
  host: ${oc.env:ELASTICSEARCH_HOST,localhost}
  port: ${oc.env:ELASTICSEARCH_PORT,9200}
  index_name: ${oc.env:ELASTICSEARCH_INDEX,data_agent}

llm:
  model_name: ${oc.env:LLM_MODEL_NAME,Pro/zai-org/GLM-5.1}
  api_key: ${oc.env:LLM_API_KEY}
  base_url: ${oc.env:LLM_BASE_URL,https://api.siliconflow.cn/v1}

sql_safety:
  max_length: ${oc.env:SQL_MAX_LENGTH,20000}
  max_result_rows: ${oc.env:SQL_MAX_RESULT_ROWS,1000}
  max_correction_attempts: ${oc.env:SQL_MAX_CORRECTION_ATTEMPTS,2}
  max_execution_time_ms: ${oc.env:SQL_MAX_EXECUTION_TIME_MS,15000}
