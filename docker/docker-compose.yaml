name: ecommerce-insight-agent

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-insight_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-change_me_app}
      MYSQL_READONLY_USER: ${MYSQL_READONLY_USER:-insight_readonly}
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD:-change_me_readonly}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch:
    build: ./elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT_EXPOSED:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  kibana:
    image: kibana:8.19.10
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMBEDDING_PORT_EXPOSED:-8081}:80"
    environment:
      MODEL_ID: /models/bge-large-zh-v1.5
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
    volumes:
      - ${EMBEDDING_MODEL_PATH:-./embedding/bge-large-zh-v1.5}:/models/bge-large-zh-v1.5:ro

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-Pro/zai-org/GLM-5.1}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      META_DB_HOST: mysql
      META_DB_PORT: 3306
      META_DB_USER: ${MYSQL_APP_USER:-insight_app}
      META_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change_me_app}
      META_DB_NAME: meta
      DW_DB_HOST: mysql
      DW_DB_PORT: 3306
      DW_DB_USER: ${MYSQL_READONLY_USER:-insight_readonly}
      DW_DB_PASSWORD: ${MYSQL_READONLY_PASSWORD:-change_me_readonly}
      DW_DB_NAME: dw
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_EMBEDDING_SIZE: ${QDRANT_EMBEDDING_SIZE:-1024}
      EMBEDDING_HOST: embedding
      EMBEDDING_PORT: 80
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-large-zh-v1.5}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-data_agent}
      SQL_MAX_LENGTH: ${SQL_MAX_LENGTH:-20000}
      SQL_MAX_RESULT_ROWS: ${SQL_MAX_RESULT_ROWS:-1000}
      SQL_MAX_CORRECTION_ATTEMPTS: ${SQL_MAX_CORRECTION_ATTEMPTS:-2}
      SQL_MAX_EXECUTION_TIME_MS: ${SQL_MAX_EXECUTION_TIME_MS:-15000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  es_data:
  qdrant_data:
